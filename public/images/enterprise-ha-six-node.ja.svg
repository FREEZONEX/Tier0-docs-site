<text x="1492" y="866" text-anchor="start" font-size="13" font-weight="500" fill="#475569"><tspan x="1492" dy="0">キャッシュ切替で再ログインが必要な場合あり</tspan></text>
<rect x="72" y="932" width="1656" height="112" rx="20" fill="#173f66" stroke="none" stroke-width="2"/>
