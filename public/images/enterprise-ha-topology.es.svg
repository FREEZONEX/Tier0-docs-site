<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1260" viewBox="0 0 1280 1260">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Yu Gothic", "Meiryo", "Malgun Gothic", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 600 18px "Microsoft YaHei", "Yu Gothic", "Meiryo", "Malgun Gothic", Arial, sans-serif; fill: #374151; }
      .group { fill: #fafafa; stroke: #94a3b8; stroke-width: 2; rx: 18; ry: 18; }
      .area { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .db-area { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .ctrl-area { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; rx: 18; ry: 18; }
      .vip { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 18; ry: 18; }
      .node { fill: #ffffff; stroke: #22c55e; stroke-width: 2; rx: 14; ry: 14; }
      .db1 { fill: #f0fdf4; stroke: #4ade80; stroke-width: 2; rx: 16; ry: 16; }
      .db2 { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 16; ry: 16; }
      .client { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 14; ry: 14; }
      .h1 { font: 700 20px "Microsoft YaHei", "Yu Gothic", "Meiryo", "Malgun Gothic", Arial, sans-serif; fill: #111827; }
      .label { font: 700 16px "Microsoft YaHei", "Yu Gothic", "Meiryo", "Malgun Gothic", Arial, sans-serif; fill: #111827; }
      .small { font: 500 13px "Microsoft YaHei", "Yu Gothic", "Meiryo", "Malgun Gothic", Arial, sans-serif; fill: #475569; }
      .ip { font: 700 13px Arial, sans-serif; fill: #2563eb; }
      .spec { font: 600 13px "Microsoft YaHei", "Yu Gothic", "Meiryo", "Malgun Gothic", Arial, sans-serif; fill: #166534; }
      .line { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .legend { font: 600 13px "Microsoft YaHei", "Yu Gothic", "Meiryo", "Malgun Gothic", Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect x="30" y="30" width="1220" height="1190" class="group"/>
  <text x="640" y="72" text-anchor="middle" class="title">Ruta norte-sur de datos en tier0-enterprise con seis VM</text>
  <text x="640" y="102" text-anchor="middle" class="subtitle">Clientes / sistemas de sitio -&gt; APP VIP -&gt; tres nodos Docker Swarm -&gt; DB VIP -&gt; base de datos primaria actual</text>

  <rect x="80" y="135" width="1120" height="760" class="area"/>
  <text x="120" y="175" class="h1">Flujo de datos de negocio norte-sur</text>

  <rect x="510" y="205" width="260" height="74" class="client"/>
  <text x="640" y="235" text-anchor="middle" class="label">Clientes / sistemas de sitio</text>
  <text x="640" y="257" text-anchor="middle" class="small">Solicitudes de negocio</text>

  <rect x="495" y="330" width="290" height="78" class="vip"/>
  <text x="640" y="362" text-anchor="middle" class="label">APP VIP</text>
  <text x="640" y="384" text-anchor="middle" class="ip">10.60.10.10 : 443</text>
  <text x="640" y="402" text-anchor="middle" class="small">Entrada flotante entre nodos Swarm</text>

  <path d="M 640 279 L 640 330" class="line"/>
  <text x="670" y="310" class="small">HTTPS 443</text>

  <rect x="130" y="500" width="300" height="88" class="node"/>
  <text x="280" y="532" text-anchor="middle" class="label">ent-swarm-01</text>
  <text x="280" y="554" text-anchor="middle" class="ip">10.60.10.11</text>
  <text x="280" y="575" text-anchor="middle" class="spec">8C / 32G / 100G</text>

  <rect x="490" y="500" width="300" height="88" class="node"/>
  <text x="640" y="532" text-anchor="middle" class="label">ent-swarm-02</text>
  <text x="640" y="554" text-anchor="middle" class="ip">10.60.10.12</text>
  <text x="640" y="575" text-anchor="middle" class="spec">8C / 32G / 100G</text>

  <rect x="850" y="500" width="300" height="88" class="node"/>
  <text x="1000" y="532" text-anchor="middle" class="label">ent-swarm-03</text>
  <text x="1000" y="554" text-anchor="middle" class="ip">10.60.10.13</text>
  <text x="1000" y="575" text-anchor="middle" class="spec">8C / 32G / 100G</text>

  <rect x="100" y="635" width="250" height="74" class="ctrl-area"/>
  <text x="225" y="663" text-anchor="middle" class="label">NFS / NAS compartido</text>
  <text x="225" y="684" text-anchor="middle" class="small">Dependencia externa, fuera de las 6 VM</text>
  <text x="225" y="702" text-anchor="middle" class="ip">10.60.40.10 : 2049</text>

  <path d="M 640 408 C 640 455 280 455 280 500" class="line"/>
  <path d="M 640 408 L 640 500" class="line"/>
  <path d="M 640 408 C 640 455 1000 455 1000 500" class="line"/>
  <text x="640" y="465" text-anchor="middle" class="small">APP VIP distribuye solicitudes a los nodos Swarm</text>
  <text x="640" y="618" text-anchor="middle" class="small">tier0 usa réplica móvil; EMQX debe fijarse o ejecutarse en clúster</text>
  <path d="M 350 672 C 420 640 490 615 560 588" class="dash"/>
  <path d="M 350 672 C 485 680 575 650 640 588" class="dash"/>
  <path d="M 350 672 C 610 720 820 650 1000 588" class="dash"/>
  <text x="390" y="720" class="small">Compartidos: cargas / imports / exports / informes</text>

  <rect x="495" y="695" width="290" height="78" class="vip"/>
  <text x="640" y="727" text-anchor="middle" class="label">DB VIP</text>
  <text x="640" y="749" text-anchor="middle" class="ip">10.60.20.10 : 5432</text>
  <text x="640" y="767" text-anchor="middle" class="small">Entrada DB unificada, apunta a la primaria</text>

  <path d="M 280 588 C 280 650 640 650 640 695" class="line"/>
  <path d="M 640 588 L 640 695" class="line"/>
  <path d="M 1000 588 C 1000 650 640 650 640 695" class="line"/>
  <text x="640" y="655" text-anchor="middle" class="small">Los nodos Swarm acceden al DB VIP mediante PostgreSQL 5432</text>

  <rect x="80" y="930" width="1120" height="230" class="db-area"/>
  <text x="120" y="970" class="h1">Alta disponibilidad y supervisión de base de datos</text>

  <rect x="260" y="995" width="310" height="64" class="db1"/>
  <text x="415" y="1022" text-anchor="middle" class="label">ent-db-01 candidato primario</text>
  <text x="415" y="1044" text-anchor="middle" class="ip">10.60.20.11 / 4C 8G 500G</text>

  <rect x="710" y="995" width="310" height="64" class="db2"/>
  <text x="865" y="1022" text-anchor="middle" class="label">ent-db-02 candidato standby</text>
  <text x="865" y="1044" text-anchor="middle" class="ip">10.60.20.12 / 4C 8G 500G</text>

  <rect x="530" y="1082" width="220" height="62" class="ctrl-area"/>
  <text x="640" y="1107" text-anchor="middle" class="label">Witness</text>
  <text x="640" y="1127" text-anchor="middle" class="ip">10.60.20.13</text>
  <text x="640" y="1143" text-anchor="middle" class="small">2C / 4G / 40G</text>

  <path d="M 640 773 C 640 855 445 900 415 995" class="line"/>
  <path d="M 640 773 C 640 855 835 900 865 995" class="dash"/>
  <text x="640" y="900" text-anchor="middle" class="small">DB VIP apunta a la primaria y cambia tras failover</text>

  <path d="M 570 1027 L 710 1027" class="dash"/>
  <text x="640" y="1010" text-anchor="middle" class="small">Replicación WAL</text>
  <path d="M 585 1082 C 560 1068 500 1064 455 1059" class="dash"/>
  <path d="M 695 1082 C 720 1068 780 1064 825 1059" class="dash"/>
  <text x="640" y="1072" text-anchor="middle" class="small">Quórum / promoción / comprobaciones de salud</text>

  <line x1="120" y1="1190" x2="190" y2="1190" class="line"/>
  <text x="205" y="1195" class="legend">Ruta norte-sur de negocio</text>
  <line x1="430" y1="1190" x2="500" y2="1190" class="dash"/>
  <text x="515" y="1195" class="legend">Replicación / quórum / failover</text>
  <text x="825" y="1195" class="legend">VM: 6 = 3 Swarm + 2 DB + 1 Witness</text>
</svg>
